name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://motorlane_ci:ci_test_only@localhost:5432/motorlane_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: motorlane_ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: motorlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motorlane_ci -d motorlane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      # The pytest session fixture applies migrations to the test database.
      - name: PostgreSQL tests
        run: uv run --no-sync pytest -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: API Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image locally without pushing
        run: docker build --tag motorlane-api:ci ./api
