[project]
name = "motorlane-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.44.5",
    "fastapi>=0.162.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
