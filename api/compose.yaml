name: motorlane-api

x-moto: &moto
  image: motoserver/moto:5.1.22
  environment:
    S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 20

services:
  moto:
    <<: *moto
    ports:
      - "127.0.0.1:5000:5000"

  moto-test:
    <<: *moto
    profiles: [test]
    ports:
      - "127.0.0.1:5001:5000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: motorlane
      POSTGRES_PASSWORD: motorlane
      POSTGRES_DB: motorlane
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorlane -d motorlane"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://motorlane:motorlane@db:5432/motorlane
      AWS_ACCESS_KEY_ID: motorlane-local
      AWS_SECRET_ACCESS_KEY: motorlane-local
      AWS_DEFAULT_REGION: us-east-1
      S3_PHOTO_BUCKET: ${S3_PHOTO_BUCKET:-motorlane-photos}
      S3_ENDPOINT_URL: ${S3_DOCKER_ENDPOINT_URL:-http://moto:5000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:5000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      moto:
        condition: service_healthy
    # Apply migrations before serving requests in this single-container setup.
    command: ["sh", "-c", "uv run --no-sync python -m app.photo_storage && uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: motorlane
      POSTGRES_PASSWORD: motorlane
      POSTGRES_DB: motorlane_test
    ports:
      - "127.0.0.1:5434:5432"
    # Test data is disposable and never shares the development volume.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorlane -d motorlane_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
